name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP Syntax Check
        run: find . -name "*.php" -not -path "./.upstream/*" -not -path "./vendor/*" | xargs -n1 php -l

  e2e:
    name: E2E (WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.8 exercises the bundled Abilities API polyfill; 6.9 is the first
        # release with the core Abilities API — the path that regressed in
        # issues #12/#13, so both must stay green.
        wp: ['6.8', '6.9']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Start WordPress ${{ matrix.wp }}
        env:
          WP_ENV_CORE: WordPress/WordPress#${{ matrix.wp }}
        run: npx wp-env start
      - name: Enable pretty permalinks (required for REST + OAuth/.well-known routing)
        # --hard regenerates .htaccess so Apache routes /wp-json/, /.well-known/,
        # and /wp-mcp-oauth/ to index.php; a soft flush only updates the option.
        run: |
          npx wp-env run cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run cli wp rewrite flush --hard
      - name: Create application password for MCP auth tests
        run: |
          PASS="$(npx wp-env run cli wp user application-password create admin playwright-ci --porcelain)"
          echo "WP_APP_PASSWORD=${PASS}" >> "$GITHUB_ENV"
      - name: (debug) REST-context probe on WordPress 6.9
        if: matrix.wp == '6.9'
        run: |
          BASE=http://localhost:8889
          AUTH=$(printf 'admin:%s' "$WP_APP_PASSWORD" | base64 -w0)
          hdr=(-H "Authorization: Basic $AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          echo '--- initialize ---'
          curl -s -D /tmp/h.txt -o /tmp/init.txt -X POST "$BASE/wp-json/mcp/wp-mcp-ultimate" "${hdr[@]}" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"dbg","version":"1"}}}'
          SID=$(grep -i '^mcp-session-id:' /tmp/h.txt | awk '{print $2}' | tr -d '\r')
          echo "session=$SID"
          echo '--- get-ability-info plugins/list (fails in REST) ---'
          curl -s -X POST "$BASE/wp-json/mcp/wp-mcp-ultimate" "${hdr[@]}" -H "Mcp-Session-Id: $SID" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"wp-mcp-ultimate-get-ability-info","arguments":{"ability_name":"plugins/list"}}}'; echo
          echo '--- get-ability-info options/get (passes in REST) ---'
          curl -s -X POST "$BASE/wp-json/mcp/wp-mcp-ultimate" "${hdr[@]}" -H "Mcp-Session-Id: $SID" \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"wp-mcp-ultimate-get-ability-info","arguments":{"ability_name":"plugins/list","dummy":1}}}'; echo
          echo '--- discover-abilities: is plugins/list present in REST? ---'
          curl -s -X POST "$BASE/wp-json/mcp/wp-mcp-ultimate" "${hdr[@]}" -H "Mcp-Session-Id: $SID" \
            -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"wp-mcp-ultimate-discover-abilities","arguments":{}}}' \
            | tr ',' '\n' | grep -i 'plugins/' || echo 'no plugins/* in discover output'
      - name: Run Playwright E2E
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wp-${{ matrix.wp }}
          path: playwright-report/
          retention-days: 7
      - name: Stop WordPress
        if: always()
        run: npx wp-env stop
